# Har push pe GitHub khud tests chalayega. Green tick = us din ka kaam sahi.
name: CI

on: [push, pull_request]

jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: DSA + Python fluency tests
        run: pytest -q || [ $? -eq 5 ]   # exit 5 = abhi koi test nahi, fail mat karo

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Har backend project ke tests
        env:
          SECRET_KEY: ci-test-secret
        run: |
          shopt -s nullglob
          found=0
          for dir in backend/*/; do
            if [ -f "$dir/requirements.txt" ] && [ -d "$dir/tests" ]; then
              found=1
              echo "::group::$dir"
              python -m venv "/tmp/venv-$(basename $dir)"
              source "/tmp/venv-$(basename $dir)/bin/activate"
              pip install -q -r "$dir/requirements.txt"
              (cd "$dir" && pytest -q)
              deactivate
              echo "::endgroup::"
            fi
          done
          [ $found -eq 0 ] && echo "Abhi koi backend project nahi (Week 2 se shuru hoga)" || true
